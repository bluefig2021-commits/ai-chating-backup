<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대화방</title>
<style>
:root{--fs:13px;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",Helvetica,Arial,sans-serif;word-break:keep-all;padding:clamp(12px,4vw,48px) 16px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--w,780px);margin:0 auto;background:#fff;border:1px solid #e3e3e3;border-radius:24px;padding:clamp(18px,4vw,32px)}
.wrap[hidden]{display:none}
#login[hidden]{display:none}
#login{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:40vh;gap:20px}
#login .logo{margin:0}
#gLogin{flex:none;width:auto;height:42px;padding:0 26px;border-radius:20px;background:#000}
#lErr{color:#ff4d4f;text-align:center;min-height:16px;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;color:#0f172a}
.btn{padding:5px 15px;border:1px solid #ccc;border-radius:15px;background:#fff;cursor:pointer;font-size:12px;letter-spacing:1px;color:#888}
.btn.on{background:#0f172a;border-color:#0f172a;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chips .btn{padding:5px 12px;border-color:#ddd;letter-spacing:0}
.chips .btn.on{border-color:#0f172a}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.round{width:46px;height:46px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#0f172a;font-size:18px;cursor:pointer;flex:none}
.rand{flex:1;max-width:200px;height:42px;border:0;border-radius:20px;background:#000;color:#fff;font-weight:700;font-size:14px;letter-spacing:1px;cursor:pointer}
.card{border-radius:0;background:#fff;padding:6px 2px 0;min-height:250px;display:flex;flex-direction:column}
.top{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12px;color:#999}
.tag{background:#0f172a;color:#fff;border-radius:999px;padding:4px 11px;font-weight:600}
h2{font-size:18px;line-height:1.35;font-weight:800;letter-spacing:-.3px;color:#0f172a;margin:0 0 12px}
.chat{display:flex;flex-direction:column;gap:18px;flex:1;cursor:pointer;min-height:140px}
.row{display:flex;flex-direction:column;max-width:92%;animation:flip .16s ease-out}
.row.a{align-self:flex-start;align-items:flex-start;max-width:100%}
.row.u{align-self:flex-end;align-items:flex-end}
.who{font-size:11px;color:#999;margin:0 6px 2px}
.row.a .who{margin-left:2px}
.bub{padding:10px 13px;border-radius:16px;font-size:var(--fs,13px);line-height:1.7;overflow-wrap:anywhere}
.a .bub{background:transparent;border:0;border-radius:0;padding:2px 2px;color:#333}
.u .bub{background:#e9e7e7;color:#1f1f1f;border-top-right-radius:4px}
.bub .h{font-weight:700;margin:0 0 4px}
.bub .p{margin:0}
.bub .p+.p,.bub .li+.p,.bub .p+.li,.bub .h+.p,.bub .h+.li{margin-top:6px}
.bub .li{padding-left:1em;text-indent:-1em;margin-top:3px}
.bub strong{font-weight:700}
.hint{color:#aaa;font-size:13px;text-align:center;margin:auto}
@keyframes flip{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.row{animation:none}}
.foot{display:flex;align-items:center;gap:10px;margin-top:14px}
.next{flex:1;height:44px;border:0;border-radius:20px;background:#0f172a;color:#fff;font-weight:700;font-size:14px;letter-spacing:1px;cursor:pointer}
.next[disabled]{opacity:.3;cursor:default}
.prog{font-size:12px;color:#aaa;min-width:48px;text-align:right;letter-spacing:1px}
.panel{background:#f7f7f8;border-radius:14px;padding:14px;margin-bottom:14px;display:grid;gap:8px}
.panel[hidden]{display:none}
.panel input,.panel select,.panel textarea{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 11px;width:100%;font-size:14px}
.panel textarea{min-height:140px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12px;color:#888;line-height:1.5}
.danger{color:#ff4d4f}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:#aaa;letter-spacing:1px;gap:8px}
.ed{display:grid;gap:8px}
.ed input,.ed textarea{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 11px;width:100%;font-size:14px}
.ed textarea{resize:vertical;line-height:1.6}
.mrow{background:#fff;border:1px solid #e8e8ea;border-radius:12px;padding:8px;display:grid;gap:6px}
.mhead{display:flex;justify-content:space-between;align-items:center}
.turn{background:#fff;border:1px solid #e8e8ea;border-radius:12px;padding:8px;display:grid;gap:6px}
.lab{font-size:11px;font-weight:700;color:#999;letter-spacing:.5px}
.turn textarea{min-height:84px;line-height:1.6}
.turn textarea.tu{background:#eef0f5}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center}
.crow input:disabled{background:#f0f0f0;color:#999}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #0f172a;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="login" hidden>
  <div class="logo">대화방</div>
  <button class="next" id="gLogin" type="button">Google로 로그인</button>
  <div class="small" id="lErr"></div>
</div>

<div class="wrap" id="app" hidden>
  <div class="head">
    <div class="logo">대화방 <span style="font-size:10px;color:#aaa;font-weight:400">v14</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn" id="fm" type="button" aria-label="글자 작게">가−</button>
      <button class="btn" id="fp" type="button" aria-label="글자 크게">가＋</button>
      <button class="btn" id="wm" type="button" aria-label="화면 좁게">폭−</button>
      <button class="btn" id="wp" type="button" aria-label="화면 넓게">폭＋</button>
      <button class="btn" id="tAdd" type="button">＋ 추가</button>
      <button class="btn" id="tCat" type="button">분류</button>
      <button class="btn" id="tBak" type="button">백업</button>
      <button class="btn" id="out" type="button">로그아웃</button>
    </div>
  </div>

  <section class="panel" id="pAdd" hidden>
    <input id="fTitle" placeholder="제목 (비우면 첫 줄로 자동)">
    <div class="two">
      <input id="fCat" placeholder="카테고리 (직접 입력하면 새로 추가돼)">
      <input id="fDate" type="date">
    </div>
    <datalist id="cats"></datalist>
    <div class="chips" id="fCatChips" style="margin:0"></div>
    <button class="btn" id="fAiCat" type="button">✨ AI로 카테고리 자동분류</button>
    <select id="fAi">
      <option>ChatGPT</option><option>제미나이</option><option>구글 AI 모드</option><option>Claude</option><option>AI</option>
    </select>
    <div id="fTurns" style="display:grid;gap:8px"></div>
    <button class="btn" id="fAddTurn" type="button">＋ 질문/답변 칸 추가</button>
    <div class="small" id="fPrev"></div>
    <button class="next" id="fSave" type="button" style="height:42px">저장</button>
  </section>

  <section class="panel" id="pCat" hidden>
    <div id="catList" style="display:grid;gap:6px"></div>
    <div class="two">
      <input id="cNew" placeholder="새 카테고리 이름">
      <button class="btn" id="cAdd" type="button">＋ 추가</button>
    </div>
    <div class="small" id="cMsg">이름 바꾸면 그 카테고리 대화도 같이 바뀌어. 삭제하면 대화는 "기타"로 이동해.</div>
    <div class="small" style="margin-top:8px"><b>AI 자동분류</b> · aistudio.google.com 에서 API 키 발급받아서 넣어줘</div>
    <input id="gKey" type="password" placeholder="Gemini API 키" autocomplete="off">
    <div class="two">
      <input id="gModel" placeholder="모델 (비우면 gemini-2.5-flash)">
      <button class="btn" id="gSave" type="button">키 저장</button>
    </div>
    <div class="small" id="gMsg"></div>
  </section>

  <section class="panel" id="pBak" hidden>
    <div class="small">이 사이트 데이터는 이 브라우저에만 저장돼. 기기 바꾸거나 캐시 지우면 날아가니까 가끔 내보내기로 복사해서 메모장 같은 데 보관해둬.</div>
    <textarea id="bTxt" placeholder="여기에 백업 JSON이 나오거나, 가져올 JSON을 붙여넣어"></textarea>
    <div class="two">
      <button class="btn" id="bOut" type="button">내보내기 (복사)</button>
      <button class="btn" id="bIn" type="button">가져오기 (합치기)</button>
    </div>
    <div class="small" id="bMsg"></div>
  </section>

  <div class="small" id="st" style="margin-bottom:8px"></div>
  <div class="chips" id="chips" role="group" aria-label="카테고리"></div>

  <div class="ctl">
    <button class="round" id="prev" type="button" aria-label="이전 대화">←</button>
    <button class="rand" id="rand" type="button">RANDOM</button>
    <button class="round" id="nextC" type="button" aria-label="다음 대화">→</button>
  </div>

  <article class="card" id="card"></article>
  <div class="meta"><span id="count"></span><span style="display:flex;gap:6px"><button class="btn" id="edit" type="button">수정</button><button class="btn danger" id="del" type="button">삭제</button></span></div>
</div>

<script type="module">
var $ = function (id) { return document.getElementById(id); };
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const ADMIN_EMAIL = "raizn199x@gmail.com";
const firebaseConfig = {
  apiKey: "AIzaSyATMcuUcUeWVmIXLAO1DAX3eAxiphf8gYc",
  authDomain: "reading-8c814.firebaseapp.com",
  projectId: "reading-8c814",
  storageBucket: "reading-8c814.firebasestorage.app",
  messagingSenderId: "765596616012",
  appId: "1:765596616012:web:fba2289033b34cd23e3be9",
  measurementId: "G-FT8GR3ZD94"
};
const fbApp = initializeApp(firebaseConfig), auth = getAuth(fbApp), db = getFirestore(fbApp);
var synced = {};
function status(t) { $("st").textContent = t; }
var DEFAULT_CATS = ["사회구조 뒷담", "연예인 뒷담", "기타"];
var catList = DEFAULT_CATS.slice(), syncedCats = JSON.stringify(DEFAULT_CATS);
var convs = [], cat = "전체", idx = 0, shown = {};

function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
async function save() {
  try {
    var cs = JSON.stringify(catList);
    if (cs !== syncedCats) { await setDoc(doc(db, "chats", "__cats"), { cats: catList }); syncedCats = cs; }
    for (var i = 0; i < convs.length; i++) {
      var c = convs[i], s = JSON.stringify(c);
      if (synced[c.id] !== s) { await setDoc(doc(db, "chats", c.id), c); synced[c.id] = s; }
    }
    var ids = Object.keys(synced);
    for (var j = 0; j < ids.length; j++) {
      if (!convs.some(function (x) { return x.id === ids[j]; })) { await deleteDoc(doc(db, "chats", ids[j])); delete synced[ids[j]]; }
    }
    status("저장됨");
  } catch (e) { status("저장 실패: Firestore 규칙 확인해봐 (" + (e.code || e.message) + ")"); }
}
async function loadRemote() {
  var snap = await getDocs(collection(db, "chats"));
  convs = []; synced = {}; catList = DEFAULT_CATS.slice();
  snap.forEach(function (d) {
    var c = d.data();
    if (d.id === "__cats") { if (Array.isArray(c.cats) && c.cats.length) catList = c.cats; return; }
    c.id = d.id; convs.push(c); synced[c.id] = JSON.stringify(c);
  });
  syncedCats = JSON.stringify(catList);
}
function cats() {
  var s = catList.slice();
  convs.forEach(function (c) { if (s.indexOf(c.cat) < 0) s.push(c.cat); });
  return s;
}
function list() {
  return convs.filter(function (c) { return cat === "전체" || c.cat === cat; })
    .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
}
function fmt(d) { return d.replace(/-/g, "."); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderChips() {
  var box = $("chips"); box.textContent = "";
  ["전체"].concat(cats()).forEach(function (c) {
    var b = el("button", "btn" + (c === cat ? " on" : ""), c);
    b.type = "button";
    b.onclick = function () { if (editing) return; cat = c; idx = 0; render(); };
    box.appendChild(b);
  });
  var dl = $("cats"); dl.textContent = "";
  cats().forEach(function (c) { var o = document.createElement("option"); o.value = c; dl.appendChild(o); });
}

function inline(parent, s) {
  s.split(/(\*\*[^*]+\*\*)/).forEach(function (p) {
    if (!p) return;
    if (/^\*\*[^*]+\*\*$/.test(p)) { var st = document.createElement("strong"); st.textContent = p.slice(2, -2); parent.appendChild(st); }
    else parent.appendChild(document.createTextNode(p));
  });
}
function renderMd(parent, t) {
  t.split("\n").forEach(function (line) {
    if (!line.trim()) return;
    var m, d;
    if ((m = line.match(/^\s*#{1,6}\s+(.*)$/))) { d = el("div", "h"); inline(d, m[1]); }
    else if ((m = line.match(/^\s*[*\-•]\s+(.*)$/))) { d = el("div", "li"); inline(d, "• " + m[1]); }
    else if ((m = line.match(/^\s*(\d+)[.)]\s+(.*)$/))) { d = el("div", "li"); inline(d, m[1] + ". " + m[2]); }
    else { d = el("div", "p"); inline(d, line.trim()); }
    parent.appendChild(d);
  });
}
function splitLong(b) {
  var units = [], out = [], cur = "";
  b.split("\n").forEach(function (line) {
    line = line.trim(); if (!line) return;
    if (line.length > 280) (line.match(/[^.!?]+[.!?]+\s*|[^.!?]+$/g) || [line]).forEach(function (s, i) { units.push({ t: s.trim(), sep: i ? " " : "\n" }); });
    else units.push({ t: line, sep: "\n" });
  });
  units.forEach(function (u) {
    if (cur && (cur + u.sep + u.t).length > 280) { out.push(cur); cur = ""; }
    cur += (cur ? u.sep : "") + u.t;
  });
  if (cur) out.push(cur);
  return out;
}
function chunkify(t) {
  var blocks = t.replace(/\r/g, "").split(/\n\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean), out = [];
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    if (i + 1 < blocks.length && b.length < 120 && b.indexOf("\n") < 0 && (b.length < 40 || /^#{1,6}\s/.test(b))) { blocks[i + 1] = b + "\n\n" + blocks[i + 1]; continue; }
    if (b.length > 320) splitLong(b).forEach(function (x) { out.push(x); }); else out.push(b);
  }
  return out;
}
function view(c) { return c.msgs; }
function addBubble(chat, m, conv) {
  var row = el("div", "row " + m.r);
  row.appendChild(el("div", "who", m.r === "u" ? "나" : conv.ai));
  var b = el("div", "bub"); renderMd(b, m.t);
  row.appendChild(b);
  chat.appendChild(row);
  return row;
}

function render() {
  renderChips();
  var L = list(), card = $("card"); card.textContent = "";
  $("count").textContent = L.length ? (idx + 1) + " / " + L.length : "";
  $("del").style.visibility = $("edit").style.visibility = L.length ? "visible" : "hidden";
  if (!L.length) { card.appendChild(el("div", "hint", "이 카테고리엔 아직 대화가 없어. ＋ 추가로 넣어봐")); return; }
  if (idx >= L.length) idx = 0;
  if (editing) { renderEdit(card); return; }
  var c = L[idx], V = view(c), n = V.length; if (shown[c.id] === undefined) shown[c.id] = Math.min(1, n); if (shown[c.id] > n) shown[c.id] = n;
  var k = shown[c.id];
  var top = el("div", "top"); top.appendChild(el("span", "tag", c.cat)); top.appendChild(el("span", "", fmt(c.date) + " · " + c.ai));
  card.appendChild(top); card.appendChild(el("h2", "", c.title));
  var chat = el("div", "chat"); chat.id = "chat";
  chat.onclick = function () { if (String(window.getSelection()).length) return; advance(); };
  if (!k) chat.appendChild(el("div", "hint", "탭하면 첫 말풍선이 나와"));
  for (var i = 0; i < k; i++) addBubble(chat, V[i], c);
  card.appendChild(chat);
  var foot = el("div", "foot");
  var nb = el("button", "next", k < n ? "다음 ▸" : "끝"); nb.disabled = k >= n;
  nb.type = "button"; nb.onclick = advance;
  foot.appendChild(nb); foot.appendChild(el("div", "prog", k + " / " + n));
  card.appendChild(foot);
}

function advance() {
  if (editing) return;
  var L = list(); if (!L.length) return;
  var c = L[idx], V = view(c), k = shown[c.id] || 0;
  if (k >= V.length) return;
  shown[c.id] = k + 1;
  var chat = $("chat"); if (k === 0) chat.textContent = "";
  var row = addBubble(chat, V[k], c);
  var n = V.length, nk = k + 1;
  var nb = document.querySelector(".next"); nb.textContent = nk < n ? "다음 ▸" : "끝"; nb.disabled = nk >= n;
  document.querySelector(".prog").textContent = nk + " / " + n;
  row.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

$("prev").onclick = function () { if (editing) return; var L = list(); if (L.length) { idx = (idx - 1 + L.length) % L.length; render(); } };
$("nextC").onclick = function () { if (editing) return; var L = list(); if (L.length) { idx = (idx + 1) % L.length; render(); } };
$("rand").onclick = function () {
  if (editing) return;
  var L = list(); if (!L.length) return;
  var j = idx; if (L.length > 1) while (j === idx) j = Math.floor(Math.random() * L.length);
  idx = j; render();
};
$("del").onclick = function () {
  if (editing) return;
  var L = list(); if (!L.length) return;
  var c = L[idx];
  if (!confirm("“" + c.title + "” 삭제할까?")) return;
  convs = convs.filter(function (x) { return x.id !== c.id; }); save(); idx = 0; render();
};
document.addEventListener("keydown", function (e) {
  var t = e.target.tagName; if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || t === "BUTTON") return;
  if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); advance(); }
});

var editing = false, draft = null;
function startEdit() {
  if (editing) return;
  var L = list(); if (!L.length) return;
  var c = L[idx];
  draft = { id: c.id, title: c.title, cat: c.cat, date: c.date, ai: c.ai, msgs: c.msgs.map(function (m) { return { r: m.r, t: m.t }; }) };
  editing = true; render();
}
function field(ph, val, on, type) {
  var i = el("input"); if (type) i.type = type; i.placeholder = ph; i.value = val; i.oninput = function () { on(i.value); }; return i;
}
function renderEdit(card) {
  card.textContent = "";
  var box = el("div", "ed"), two = el("div", "two");
  box.appendChild(field("제목", draft.title, function (v) { draft.title = v; }));
  var catIn = field("카테고리", draft.cat, function (v) { draft.cat = v; }); 
  two.appendChild(catIn); two.appendChild(field("", draft.date, function (v) { draft.date = v; }, "date"));
  box.appendChild(two);
  var cc = el("div", "chips"); cc.style.margin = "0";
  var pickIt = function (v) { draft.cat = v; };
  pickChips(cc, catIn, pickIt); box.appendChild(cc);
  var baseIn = catIn.oninput; catIn.oninput = function () { baseIn(); pickChips(cc, catIn, pickIt); };
  box.appendChild(field("AI 이름", draft.ai, function (v) { draft.ai = v; }));
  draft.msgs.forEach(function (m, i) {
    var row = el("div", "mrow"), head = el("div", "mhead");
    var rb = el("button", "btn", m.r === "u" ? "나" : (draft.ai || "AI")); rb.type = "button";
    rb.onclick = function () { m.r = m.r === "u" ? "a" : "u"; renderEdit(card); };
    var db = el("button", "btn danger", "삭제"); db.type = "button";
    db.onclick = function () { draft.msgs.splice(i, 1); renderEdit(card); };
    head.appendChild(rb); head.appendChild(db);
    var ta = el("textarea"); ta.value = m.t; ta.rows = Math.min(14, Math.max(3, m.t.split("\n").length + 1));
    ta.oninput = function () { m.t = ta.value; };
    ta.addEventListener("paste", function (e) { pasteMd(e, ta); });
    row.appendChild(head); row.appendChild(ta); box.appendChild(row);
  });
  var add = el("button", "btn", "＋ 말풍선 추가"); add.type = "button";
  add.onclick = function () { var last = draft.msgs[draft.msgs.length - 1]; draft.msgs.push({ r: last && last.r === "u" ? "a" : "u", t: "" }); renderEdit(card); };
  var foot = el("div", "two"), ok = el("button", "next", "저장"), no = el("button", "btn", "취소");
  ok.type = "button"; no.type = "button";
  ok.onclick = function () {
    var c = convs.filter(function (x) { return x.id === draft.id; })[0];
    if (c) {
      var ms = draft.msgs.filter(function (m) { return m.t.trim(); }).map(function (m) { return { r: m.r, t: m.t.trim() }; });
      c.title = draft.title.trim() || c.title; c.cat = draft.cat.trim() || "기타"; c.date = draft.date || c.date; c.ai = draft.ai.trim() || "AI";
      if (ms.length) c.msgs = ms;
      save();
      cat = "전체"; idx = Math.max(0, list().findIndex(function (x) { return x.id === c.id; }));
    }
    editing = false; draft = null; render();
  };
  no.onclick = function () { editing = false; draft = null; render(); };
  foot.appendChild(ok); foot.appendChild(no);
  box.appendChild(add); box.appendChild(foot);

}

var KW = {
  "연예인 뒷담": ["아이돌", "가수", "배우", "연예", "포토카드", "팬덤", "팬", "소속사", "기획사", "앨범", "콘서트", "드라마", "방송", "엔터", "데뷔", "컴백", "걸그룹", "보이그룹"],
  "사회구조 뒷담": ["자본", "사회", "구조", "계급", "노동", "정치", "정부", "세금", "부동산", "임금", "불평등", "기업", "월급", "경제", "체제", "복지", "재벌"]
};
function guessCat(text) {
  var best = "", bn = 0;
  Object.keys(KW).forEach(function (k) {
    var n = 0;
    KW[k].forEach(function (w) { var i = 0, p; while ((p = text.indexOf(w, i)) >= 0) { n++; i = p + w.length; } });
    if (n > bn) { bn = n; best = k; }
  });
  return bn >= 3 ? best : "";
}

/* 붙여넣을 때 굵게/제목/목록 서식 살리기 (HTML → 마크다운) */
function htmlToMd(html) {
  var doc = new DOMParser().parseFromString(html, "text/html");
  var SKIP = { SCRIPT: 1, STYLE: 1, BUTTON: 1, SVG: 1, IMG: 1, NOSCRIPT: 1, HEAD: 1, META: 1, LINK: 1, TITLE: 1 };
  function isBold(e) {
    var t = e.tagName.toUpperCase(); if (t === "B" || t === "STRONG") return true;
    var w = (e.style && e.style.fontWeight) || ""; return w === "bold" || w === "bolder" || +w >= 600;
  }
  function kids(n, b, lvl) { var o = ""; Array.prototype.forEach.call(n.childNodes, function (c) { o += conv(c, b, lvl); }); return o; }
  function conv(n, inBold, lvl) {
    if (n.nodeType === 3) return n.nodeValue.replace(/\s+/g, " ").replace(/\*/g, "");
    if (n.nodeType !== 1) return "";
    var tag = n.tagName.toUpperCase();
    if (SKIP[tag]) return "";
    if (tag === "BR") return "\n";
    if (/^H[1-6]$/.test(tag)) return "\n\n## " + kids(n, true, lvl).replace(/\s+/g, " ").trim() + "\n\n";
    if (tag === "UL" || tag === "OL") {
      var out = "\n", i = 0, pad = new Array(lvl + 1).join("  ");
      Array.prototype.forEach.call(n.children, function (li) {
        if (li.tagName.toUpperCase() !== "LI") { out += conv(li, inBold, lvl); return; }
        i++; out += pad + (tag === "OL" ? i + ". " : "- ") + kids(li, inBold, lvl + 1).trim() + "\n";
      });
      return out + "\n";
    }
    var bold = !inBold && isBold(n), inner = kids(n, inBold || bold, lvl);
    if (bold) {
      var lead = (inner.match(/^\s*/) || [""])[0], trail = (inner.match(/\s*$/) || [""])[0], core = inner.trim();
      return core ? lead + "**" + core + "**" + trail : inner;
    }
    if (tag === "P") return "\n\n" + inner.trim() + "\n\n";
    if (tag === "DIV" || tag === "SECTION" || tag === "ARTICLE" || tag === "BLOCKQUOTE" || tag === "TR" || tag === "PRE") return "\n" + inner + "\n";
    return inner;
  }
  return conv(doc.body, false, 0).replace(/[ \t]+\n/g, "\n").replace(/\n[ \t]+(?=\S)(?![-\d])/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
/* 대화 복사 버튼(나:, AI: 형식) 통째로 붙여넣기 */
function importLabeled(text) {
  if (!/^\s*나\s*[:：]/m.test(text) || !/^\s*AI\s*[:：]/m.test(text)) return false;
  var lines = text.replace(/\r/g, "").split("\n"), meta = {}, i = 0, msgs = [], cur = null;
  while (i < lines.length) {
    var m = lines[i].match(/^\s*(제목|카테고리|날짜|출처)\s*[:：]\s*(.*)$/);
    if (m) { meta[m[1]] = m[2].trim(); i++; continue; }
    if (!lines[i].trim()) { i++; continue; }
    break;
  }
  for (; i < lines.length; i++) {
    var l = lines[i].match(/^\s*(나|AI)\s*[:：]\s?(.*)$/);
    if (l) { cur = { r: l[1] === "나" ? "u" : "a", t: l[2] }; msgs.push(cur); }
    else if (cur) cur.t += "\n" + lines[i];
  }
  var ts = [], t = { u: "", a: "" };
  msgs.forEach(function (x) {
    var s = x.t.trim(); if (!s) return;
    if (x.r === "u") { if (t.u || t.a) { ts.push(t); t = { u: "", a: "" }; } t.u = s; }
    else { if (t.a) { ts.push(t); t = { u: "", a: "" }; } t.a = s; }
  });
  if (t.u || t.a) ts.push(t);
  if (!ts.length) return false;
  if (meta["출처"]) { var so = $("fAi"); for (var q = 0; q < so.options.length; q++) if (so.options[q].value === meta["출처"]) so.value = meta["출처"]; }
  if (meta["제목"]) $("fTitle").value = meta["제목"];
  if (meta["카테고리"]) $("fCat").value = meta["카테고리"];
  var d = (meta["날짜"] || "").match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if (d) $("fDate").value = d[1] + "-" + d[2].padStart(2, "0") + "-" + d[3].padStart(2, "0");
  turns = ts; renderTurns(); renderFChips();
  setTimeout(function () {
    if ($("fCat").value.trim()) return;
    if (hasKey()) { aiClassify(); return; }
    var g = guessCat(turns.map(function (x) { return x.u + "\n" + x.a; }).join("\n"));
    if (g) { $("fCat").value = g; renderFChips(); $("fPrev").textContent += " · 카테고리 자동 추천: " + g + " (바꿔도 돼)"; }
  }, 0);
  return true;
}
function pasteMd(e, ta) {
  try {
    var cd = e.clipboardData; if (!cd) return false;
    var plain = cd.getData("text/plain");
    if (plain && importLabeled(plain)) { e.preventDefault(); return true; }
    var html = cd.getData("text/html"); if (!html) return false;
    var md = htmlToMd(html); if (!md) return false;
    e.preventDefault();
    ta.setRangeText(md, ta.selectionStart, ta.selectionEnd, "end");
    ta.dispatchEvent(new Event("input"));
    return true;
  } catch (err) { return false; }
}

/* 카테고리 선택 버튼 */
function pickChips(box, input, onPick) {
  box.textContent = "";
  var cur = input.value.trim(), names = cats();
  if (cur && names.indexOf(cur) < 0) names.push(cur);
  names.forEach(function (name) {
    var b = el("button", "btn" + (name === cur ? " on" : ""), name); b.type = "button";
    b.onclick = function () { input.value = name; if (onPick) onPick(name); pickChips(box, input, onPick); };
    box.appendChild(b);
  });
}
function renderFChips() { pickChips($("fCatChips"), $("fCat"), null); }
$("fCat").oninput = renderFChips;

/* Gemini 자동분류 */
function lsGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function hasKey() { return !!lsGet("chat:gkey"); }
var clsP = null;
function aiClassify() { if (clsP) return clsP; clsP = doClassify().then(function (v) { clsP = null; return v; }, function () { clsP = null; return ""; }); return clsP; }
async function doClassify() {
  var key = lsGet("chat:gkey");
  if (!key) { $("fPrev").textContent = "분류 패널에서 Gemini API 키부터 넣어줘"; return ""; }
  var text = turns.map(function (t) { return (t.u.trim() ? "나: " + t.u.trim() + "\n" : "") + (t.a.trim() ? "AI: " + t.a.trim() + "\n" : ""); }).join("\n").trim();
  if (!text) { $("fPrev").textContent = "대화 내용부터 넣어줘"; return ""; }
  $("fPrev").textContent = "AI가 읽는 중…";
  try {
    var model = lsGet("chat:gmodel") || "gemini-2.5-flash";
    var prompt = "아래는 사용자와 AI의 대화야. 이 대화가 어느 카테고리에 제일 잘 맞는지 골라줘.\n기존 카테고리: " + JSON.stringify(cats().filter(function (c) { return c !== "기타"; })) +
      "\n규칙: 기존 카테고리 중에 확실히 맞는 게 있으면 그 이름을 토씨 하나 안 바꾸고 그대로 써. 정말 안 맞으면 짧은 새 카테고리 이름(한국어, 12자 이내)을 만들어. 애매하면 \"기타\".\n반드시 JSON만 출력: {\"cat\":\"카테고리\"}\n\n대화:\n" + text.slice(0, 6000);
    var r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0 } })
    });
    var j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    var out = j.candidates[0].content.parts.map(function (p) { return p.text || ""; }).join("");
    var v = JSON.parse(out.replace(/```json|```/g, "").trim());
    var name = String(v.cat || "").trim().slice(0, 20);
    if (!name) throw new Error("빈 답변");
    $("fCat").value = name; renderFChips();
    $("fPrev").textContent = "AI 분류: " + name + (cats().indexOf(name) < 0 ? " (새 카테고리로 만들어질 거야)" : "") + " · 바꿔도 돼";
    return name;
  } catch (e) { $("fPrev").textContent = "AI 분류 실패: " + (e.message || e); return ""; }
}
$("fAiCat").onclick = function () { aiClassify(); };
$("gSave").onclick = function () {
  try {
    localStorage.setItem("chat:gkey", $("gKey").value.trim()); localStorage.setItem("chat:gmodel", $("gModel").value.trim());
    $("gMsg").textContent = $("gKey").value.trim() ? "저장됨. 이 브라우저에만 저장되고 서버엔 안 올라가." : "키 지웠어.";
  } catch (e) { $("gMsg").textContent = "저장 실패 (브라우저가 저장을 막고 있어)"; }
};

/* 나 / AI 칸 따로 입력 */
var turns = [];
function count() {
  var n = 0; turns.forEach(function (t) { if (t.u.trim()) n++; if (t.a.trim()) n++; });
  $("fPrev").textContent = n ? "말풍선 " + n + "개" : "";
}
function renderTurns() {
  var box = $("fTurns"); box.textContent = "";
  turns.forEach(function (t, i) {
    var w = el("div", "turn"), h = el("div", "mhead");
    h.appendChild(el("span", "small", "#" + (i + 1)));
    if (turns.length > 1) {
      var d = el("button", "btn danger", "삭제"); d.type = "button";
      d.onclick = function () { turns.splice(i, 1); renderTurns(); };
      h.appendChild(d);
    }
    w.appendChild(h);
    w.appendChild(el("div", "lab", "나"));
    var tu = el("textarea", "tu"); tu.placeholder = "내 질문 붙여넣기"; tu.value = t.u;
    tu.oninput = function () { t.u = tu.value; count(); };
    tu.addEventListener("paste", function (e) { pasteMd(e, tu); });
    w.appendChild(tu);
    w.appendChild(el("div", "lab", $("fAi").value));
    var ta = el("textarea"); ta.placeholder = "AI 답변 붙여넣기"; ta.value = t.a;
    ta.oninput = function () { t.a = ta.value; count(); };
    ta.addEventListener("paste", function (e) { pasteMd(e, ta); setTimeout(function () {
      if ($("fCat").value.trim()) return;
      if (hasKey()) { aiClassify(); return; }
      var g = guessCat(turns.map(function (x) { return x.u + "\n" + x.a; }).join("\n"));
      if (g) { $("fCat").value = g; renderFChips(); $("fPrev").textContent += " · 카테고리 자동 추천: " + g + " (바꿔도 돼)"; }
    }, 0); });
    w.appendChild(ta);
    box.appendChild(w);
  });
  count();
}
function resetTurns() { turns = [{ u: "", a: "" }]; renderTurns(); }
$("fAddTurn").onclick = function () { turns.push({ u: "", a: "" }); renderTurns(); };
$("fAi").onchange = renderTurns;
resetTurns();
$("fSave").onclick = async function () {
  if (!$("fCat").value.trim() && hasKey()) await aiClassify();
  var msgs = [];
  turns.forEach(function (t) {
    if (t.u.trim()) msgs.push({ r: "u", t: t.u.trim() });
    if (t.a.trim()) msgs.push({ r: "a", t: t.a.trim() });
  });
  if (!msgs.length) { $("fPrev").textContent = "나 / AI 칸에 내용부터 넣어줘"; return; }
  var title = $("fTitle").value.trim() || msgs[0].t.split("\n")[0].slice(0, 40);
  var c = { id: "c" + Date.now(), title: title, cat: $("fCat").value.trim() || guessCat(msgs.map(function (m) { return m.t; }).join("\n")) || "기타", date: $("fDate").value || today(), ai: $("fAi").value, msgs: msgs };
  convs.push(c); save();
  $("fTitle").value = ""; $("fCat").value = ""; resetTurns(); $("pAdd").hidden = true;
  cat = "전체"; idx = list().findIndex(function (x) { return x.id === c.id; }); render();
};

/* 백업 */
$("bOut").onclick = function () {
  var s = JSON.stringify(convs); $("bTxt").value = s;
  var ok = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(s) : Promise.reject();
  ok.then(function () { $("bMsg").textContent = "복사됨. 메모장 같은 데 붙여넣어서 보관해."; })
    .catch(function () { $("bTxt").select(); $("bMsg").textContent = "복사가 막혀서 위 칸에 띄워놨어. 직접 전체 선택해서 복사해."; });
};
$("bIn").onclick = function () {
  try {
    var v = JSON.parse($("bTxt").value); if (!Array.isArray(v)) throw 0;
    var have = {}; convs.forEach(function (c) { have[c.id] = 1; }); var add = 0;
    v.forEach(function (c) { if (c && c.id && Array.isArray(c.msgs) && !have[c.id]) { convs.push(c); add++; } });
    save(); render(); $("bMsg").textContent = add + "개 가져옴";
  } catch (e) { $("bMsg").textContent = "JSON 형식이 안 맞아"; }
};

/* 카테고리 관리 */
function renderCatPanel() {
  var box = $("catList"); box.textContent = "";
  cats().forEach(function (name) {
    var row = el("div", "crow"), inp = el("input"); inp.value = name; row.appendChild(inp);
    if (name === "기타") { inp.disabled = true; }
    else {
      var ok = el("button", "btn", "수정"), del = el("button", "btn danger", "삭제"); ok.type = del.type = "button";
      ok.onclick = function () { renameCat(name, inp.value.trim()); };
      del.onclick = function () { deleteCat(name); };
      row.appendChild(ok); row.appendChild(del);
    }
    box.appendChild(row);
  });
  renderFChips();
}
function renameCat(a, b) {
  if (!b || b === a) return;
  catList = cats();
  if (catList.indexOf(b) >= 0) { $("cMsg").textContent = "이미 있는 이름이야"; return; }
  catList[catList.indexOf(a)] = b;
  convs.forEach(function (c) { if (c.cat === a) c.cat = b; });
  if (cat === a) cat = b;
  save(); render(); renderCatPanel(); $("cMsg").textContent = "바꿨어";
}
function deleteCat(a) {
  var n = convs.filter(function (c) { return c.cat === a; }).length;
  if (!confirm("“" + a + "” 삭제할까?" + (n ? "\n대화 " + n + "개는 기타로 이동해." : ""))) return;
  catList = cats().filter(function (x) { return x !== a; });
  if (catList.indexOf("기타") < 0) catList.push("기타");
  convs.forEach(function (c) { if (c.cat === a) c.cat = "기타"; });
  if (cat === a) cat = "전체";
  idx = 0; save(); render(); renderCatPanel(); $("cMsg").textContent = "삭제했어";
}
function addCat() {
  var v = $("cNew").value.trim(); if (!v) return;
  catList = cats();
  if (catList.indexOf(v) >= 0) { $("cMsg").textContent = "이미 있어"; return; }
  catList.push(v); $("cNew").value = "";
  save(); render(); renderCatPanel(); $("cMsg").textContent = "추가했어";
}
$("cAdd").onclick = addCat;
$("cNew").addEventListener("keydown", function (e) { if (e.key === "Enter") addCat(); });

function togglePanel(id) {

  if (id === "pAdd") { if (!$("fDate").value) $("fDate").value = today(); renderFChips(); }
  if (id === "pCat") { renderCatPanel(); $("gKey").value = lsGet("chat:gkey"); $("gModel").value = lsGet("chat:gmodel"); }
}
$("tAdd").onclick = function () { togglePanel("pAdd"); };
$("tCat").onclick = function () { togglePanel("pCat"); };
$("tBak").onclick = function () { togglePanel("pBak"); };

var fs = 13; try { fs = +localStorage.getItem("chat:fs") || 13; } catch (e) {}
function setFs(n) { fs = Math.max(11, Math.min(20, n)); document.documentElement.style.setProperty("--fs", fs + "px"); try { localStorage.setItem("chat:fs", fs); } catch (e) {} }
$("fm").onclick = function () { setFs(fs - 1); };
$("fp").onclick = function () { setFs(fs + 1); };
setFs(fs);
var wd = 780; try { wd = +localStorage.getItem("chat:w") || 780; } catch (e) {}
function setW(n) { wd = Math.max(480, Math.min(1100, n)); document.documentElement.style.setProperty("--w", wd + "px"); try { localStorage.setItem("chat:w", wd); } catch (e) {} }
$("wm").onclick = function () { setW(wd - 60); };
$("wp").onclick = function () { setW(wd + 60); };
setW(wd);
$("gLogin").onclick = function () { signInWithPopup(auth, new GoogleAuthProvider()).catch(function (e) { $("lErr").textContent = "로그인 실패: " + (e.code || e.message); }); };
$("out").onclick = function () { signOut(auth); };
setPersistence(auth, browserLocalPersistence).catch(function () {});
onAuthStateChanged(auth, async function (user) {
  if (!user) { $("app").hidden = true; $("login").hidden = false; return; }
  if (user.email !== ADMIN_EMAIL) { $("lErr").textContent = "이 계정은 권한이 없어."; $("app").hidden = true; $("login").hidden = false; await signOut(auth); return; }
  $("login").hidden = true; $("app").hidden = false; status("불러오는 중…");
  try { await loadRemote(); status(""); } catch (e) { convs = []; status("불러오기 실패: Firestore 규칙 확인해봐 (" + (e.code || e.message) + ")"); }
  render();
});
